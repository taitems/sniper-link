name: Publish

# Publishes to npm whenever main has a package.json version that isn't on npm yet.
# Bump the version in your PR; merging it ships the release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the git tag + GitHub release
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Check if version is already published
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm run lint
      - if: steps.version.outputs.publish == 'true'
        run: npm run test:ci
      - if: steps.version.outputs.publish == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: |
          npm install -g npm@latest
          npm publish --access public
        env:
          # Only used if trusted publishing isn't configured on npmjs.com
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and create GitHub release
        if: steps.version.outputs.publish == 'true'
        run: gh release create "${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
